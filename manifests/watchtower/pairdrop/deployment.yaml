---
# PairDrop is stateless — transfers are peer-to-peer WebRTC and nothing is
# stored server-side, so there is no PVC here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pairdrop
  namespace: sync
  labels:
    app.kubernetes.io/name: pairdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pairdrop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pairdrop
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pairdrop
          image: ghcr.io/schlagmichdoch/pairdrop:v1.11.2
          env:
            - name: PORT
              value: "3000"
            # PairDrop groups peers by public IP. Behind Traefik every request
            # would otherwise appear to come from the ingress pod, so it has to
            # trust the forwarded header to see real client addresses.
            - name: RATE_LIMIT
              value: "false"
            - name: WS_FALLBACK
              value: "true"
            - name: IPV6_LOCALIZE
              value: "4"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
