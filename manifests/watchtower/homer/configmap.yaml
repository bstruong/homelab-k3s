---
# Homer's entire state is this one file. There is no database and no backend
# process — lighttpd serves the static bundle and the browser fetches
# config.yml, so the dashboard is fully described by what is committed here.
# That is the reason Homer was chosen over Heimdall/Dashy/Flame: recovery is
# `kubectl apply`, with nothing to restore from a snapshot.
#
# Deliberately no smart cards. Homer supports per-item `type:` widgets that
# poll each service from the browser, and none are used here — live health
# belongs to Uptime Kuma. Every item below is an inert link, so
# this page makes zero outbound requests to the apps it lists.
#
# Icons are Font Awesome classes, which ship inside the image
# (/www/resources/fa-*.woff2). No remote icon CDN is referenced, so the page
# renders identically with the LAN offline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: home
  labels:
    app.kubernetes.io/name: homer
data:
  config.yml: |
    ---
    title: "Watchtower"
    subtitle: "Homelab"
    logo: false
    icon: "fas fa-tower-observation"

    header: true
    footer: false

    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    # Homer pings each service to colour a status dot when this is on. Off:
    # this page is a link list, not a monitor.
    connectivityCheck: false

    links: []

    services:
      - name: "Infrastructure"
        icon: "fas fa-network-wired"
        items:
          - name: "Cockpit"
            subtitle: "Fedora Server admin portal"
            icon: "fas fa-server"
            url: "https://watchtower.local:9090"
            target: "_blank"
          - name: "AdGuard Home"
            subtitle: "DNS and ad blocking"
            icon: "fas fa-shield-halved"
            url: "https://dns.watchtower.local"
            target: "_blank"

      - name: "Monitoring"
        icon: "fas fa-gauge-high"
        items:
          - name: "Uptime Kuma"
            subtitle: "Service uptime"
            icon: "fas fa-heart-pulse"
            url: "https://status.watchtower.local"
            target: "_blank"
          - name: "Beszel"
            subtitle: "Host metrics"
            icon: "fas fa-microchip"
            url: "https://beszel.watchtower.local"
            target: "_blank"
          - name: "ntfy"
            subtitle: "Push notifications"
            icon: "fas fa-bell"
            url: "https://ntfy.watchtower.local"
            target: "_blank"

      - name: "Identity"
        icon: "fas fa-key"
        items:
          - name: "Vaultwarden"
            subtitle: "Password manager"
            icon: "fas fa-lock"
            url: "https://vault.watchtower.local"
            target: "_blank"
          - name: "Pocket ID"
            subtitle: "Passkey OIDC provider"
            icon: "fas fa-fingerprint"
            url: "https://id.watchtower.local"
            target: "_blank"

      - name: "Documents & Media"
        icon: "fas fa-folder-open"
        items:
          - name: "Paperless-ngx"
            subtitle: "Document archive"
            icon: "fas fa-file-lines"
            url: "https://paperless.watchtower.local"
            target: "_blank"
          - name: "Immich"
            subtitle: "Photo and video backup"
            icon: "fas fa-images"
            url: "https://immich.watchtower.local"
            target: "_blank"
          - name: "Caster"
            subtitle: "MLS market intelligence pipeline"
            icon: "fas fa-chart-line"
            url: "https://caster.watchtower.local/up"
            target: "_blank"

      - name: "Workspace"
        icon: "fas fa-compass"
        items:
          - name: "Nextcloud"
            subtitle: "Files, documents & spreadsheets"
            icon: "fas fa-cloud"
            url: "https://drive.watchtower.local"
            target: "_blank"
          - name: "Odysseus"
            subtitle: "Personal AI workspace"
            icon: "fas fa-ship"
            url: "https://odysseus.watchtower.local"
            target: "_blank"

      - name: "Practice & Katas"
        icon: "fas fa-dumbbell"
        items:
          - name: "Ruby Dojo"
            subtitle: "Ruby, Rails, and RSpec Katas"
            icon: "fas fa-gem"
            url: "https://ruby-dojo.watchtower.local"
            target: "_blank"
          - name: "Python Dojo"
            subtitle: "Interactive Python exercises"
            icon: "fab fa-python"
            url: "https://python-dojo.watchtower.local"
            target: "_blank"
          - name: "Vim Dojo"
            subtitle: "Vim muscle memory drills"
            icon: "fas fa-keyboard"
            url: "https://vim-dojo.watchtower.local"
            target: "_blank"
          - name: "Interview Dojo"
            subtitle: "System Design and Behavioral prep"
            icon: "fas fa-chalkboard-user"
            url: "https://interview-dojo.watchtower.local"
            target: "_blank"
          - name: "DSA Dojo"
            subtitle: "Data Structures and Algorithms"
            icon: "fas fa-diagram-project"
            url: "https://dsa-dojo.watchtower.local"
            target: "_blank"
