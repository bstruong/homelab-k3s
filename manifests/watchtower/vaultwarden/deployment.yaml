---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: identity
  labels:
    app.kubernetes.io/name: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.1-alpine
          env:
            # Unprivileged port so the container can drop every capability.
            - name: ROCKET_PORT
              value: "8080"
            - name: DOMAIN
              value: https://vault.watchtower.local
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: warn
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden
                  key: admin-token
            # ─── SSO via Pocket ID ───────────────────────────────────────────
            # SSO is the preferred login path, NOT the only one. SSO_ONLY stays
            # false so master-password login remains available — if Pocket ID is
            # down or the OIDC client is misconfigured, the vault must still be
            # reachable.
            #
            # SSO_SIGNUPS_MATCH_EMAIL binds an incoming SSO identity to the
            # EXISTING local account whose email matches, recording the link in
            # the sso_users table, rather than creating a second empty vault.
            # The two emails were compared byte-for-byte (case-sensitive, no
            # whitespace) before this was enabled; they are identical.
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "false"
            - name: SSO_AUTHORITY
              value: https://id.watchtower.local
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: "true"
            # PKCE is enabled on the Pocket ID client, so it must be enabled
            # here too or the authorization exchange is rejected.
            - name: SSO_PKCE
              value: "true"
            - name: SSO_CLIENT_ID
              value: "d1ed2fab-5bed-4503-bcdd-08719bc28731"
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden
                  key: sso-client-secret
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: tmp
          emptyDir: {}
