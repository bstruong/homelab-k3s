---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocket-id-ingress
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow Traefik Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 1411
    # 2. Allow Node / CNI gateway / cluster subnet for probes and node-local routing
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.1.92/32
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 1411
