---
# Passkeys require a secure context, so this is HTTPS-only and HTTP redirects.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pocket-id-redirect-https
  namespace: identity
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id-http
  namespace: identity
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`id.watchtower.local`)
      middlewares:
        - name: pocket-id-redirect-https
      services:
        - name: pocket-id
          port: 1411
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id-https
  namespace: identity
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`id.watchtower.local`)
      services:
        - name: pocket-id
          port: 1411
  tls: {}
