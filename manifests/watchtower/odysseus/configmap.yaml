---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: odysseus
  labels:
    app.kubernetes.io/name: searxng
data:
  # Minimal overlay on the image's shipped settings. Two things matter here:
  #
  #   1. search.formats MUST include json. The stock image ships html only and
  #      answers /search?format=json with 403 Forbidden — verified against
  #      searxng:2026.5.31-7159b8aed. Odysseus calls the JSON API
  #      (services/search/providers.py -> httpx.get(..., format=json)), so
  #      without this the search backend is silently dead from the app's side.
  #
  #   2. server.secret_key is deliberately NOT set here. It is injected as the
  #      SEARXNG_SECRET env var from the SealedSecret in 21-secret-searxng.yaml
  #      (searx/settings_defaults.py binds SEARXNG_SECRET -> server.secret_key),
  #      which keeps the value out of this ConfigMap and out of git entirely.
  #
  # server.method is left at its POST default: verified that GET
  # /search?q=...&format=json still returns 200, so Odysseus's httpx.get works.
  settings.yml: |
    use_default_settings: true

    search:
      formats:
        - html
        - json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odysseus
  namespace: odysseus
  labels:
    app.kubernetes.io/name: odysseus
data:
  # --- Phase 1 backing services, reached over the cluster network ----------
  # src/chroma_client.py builds chromadb.HttpClient(host=..., port=...), so
  # CHROMADB_HOST is a bare host, not a URL.
  CHROMADB_HOST: chromadb.odysseus.svc.cluster.local
  CHROMADB_PORT: "8000"
  SEARXNG_INSTANCE: http://searxng.odysseus.svc.cluster.local:8080

  # --- storage -------------------------------------------------------------
  # Relative path: the app's WORKDIR is /app and the PVC mounts at /app/data.
  DATABASE_URL: sqlite:///./data/app.db

  # --- LLM backend: Metrotower's Ollama over the LAN -----------------------
  # Two different shapes, both required — they are not interchangeable:
  #   LLM_HOST        bare host; src/embeddings.py interpolates it into
  #                   http://{LLM_HOST}:11434/v1/embeddings
  #   OLLAMA_BASE_URL full URL; read by src/model_discovery.py + app.py
  # 192.168.1.245 is Metrotower on wlan0. NOTE: that is a DHCP address on
  # WiFi — if it moves, this breaks. A static reservation is worth doing.
  LLM_HOST: "192.168.1.245"
  OLLAMA_BASE_URL: http://192.168.1.245:11434

  # --- runtime identity ----------------------------------------------------
  # The image entrypoint drops to PUID:PGID via gosu. 1000:1000 matches the
  # owner of /mnt/appdata/odysseus on the host, which is what actually decides
  # writability — fsGroup does not chown hostPath volumes.
  PUID: "1000"
  PGID: "1000"

  # --- auth / web ----------------------------------------------------------
  # Native bcrypt auth stays ON. oauth2-proxy will sit in front of it in the
  # follow-up pass; it is defence in depth, not a replacement.
  AUTH_ENABLED: "true"
  LOCALHOST_BYPASS: "false"
  # Now served at https://odysseus.watchtower.local through Traefik with
  # oauth2-proxy in front, so the browser origin is external and every response
  # goes over TLS. The loopback origins stay for kubectl port-forward debugging.
  ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,https://odysseus.watchtower.local
  SECURE_COOKIES: "true"

  ANONYMIZED_TELEMETRY: "FALSE"
