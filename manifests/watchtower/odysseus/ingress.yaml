---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-http
  namespace: odysseus
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`odysseus.watchtower.local`)
      middlewares:
        - name: redirect-https
      services:
        - name: odysseus
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-https
  namespace: odysseus
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`odysseus.watchtower.local`)
      services:
        - name: odysseus
          port: 80
          responseForwarding:
            flushInterval: 100ms
  tls:
    secretName: odysseus-tls
