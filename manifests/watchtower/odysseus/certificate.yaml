---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: odysseus-tls
  namespace: odysseus
spec:
  secretName: odysseus-tls
  duration: 2160h  # 90d
  renewBefore: 360h  # 15d
  issuerRef:
    name: watchtower-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - odysseus.watchtower.local
