---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chromadb-data
  labels:
    app.kubernetes.io/name: chromadb
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/chromadb
    type: DirectoryOrCreate
  claimRef:
    namespace: odysseus
    name: chromadb-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
