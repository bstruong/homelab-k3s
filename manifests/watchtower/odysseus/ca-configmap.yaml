# Public certificate of the Watchtower Homelab Root CA.
#
# Not secret — a CA public cert is meant to be distributed; only ca.key is
# sensitive, and that lives on persistent storage outside this repo.
#
# ConfigMaps are namespace-scoped, so this is a third copy of the same
# certificate that vaultwarden/ca-configmap.yaml puts in `identity` and
# paperless-ngx/ca-configmap.yaml puts in `docs`. oauth2-proxy runs in
# `odysseus` and cannot reference either of those.
#
# oauth2-proxy needs this in its own trust store: with --provider=oidc it makes
# an outbound HTTPS call to
# https://id.watchtower.local/.well-known/openid-configuration during OIDC
# discovery, at startup. Without the issuer in trust, that fails with
# "tls: failed to verify certificate: x509: certificate signed by unknown
# authority" and the container crash-loops before it ever serves /oauth2/auth —
# the same failure mode Paperless hit, just fatal at boot rather than at login.
#
# Mounted at /etc/ssl/homelab/ca.crt and selected with --provider-ca-file;
# oauth2-proxy does not read the system bundle for the provider connection.
