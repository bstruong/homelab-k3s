---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: odysseus
  labels:
    app.kubernetes.io/name: searxng
spec:
  # Internal only. Deliberately no Ingress/IngressRoute and no
  # *.watchtower.local hostname — consumed by the Odysseus app over the
  # cluster network in the next phase, not exposed through Traefik.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
