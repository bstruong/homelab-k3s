---
apiVersion: v1
kind: Service
metadata:
  name: odysseus
  namespace: odysseus
  labels:
    app.kubernetes.io/name: odysseus
spec:
  # ClusterIP only this pass. No IngressRoute exists yet on purpose — the app
  # is not reachable from the LAN until oauth2-proxy + forwardAuth land in the
  # follow-up commit, so it is never exposed without SSO in front of it.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: odysseus
  ports:
    - name: http
      port: 7000
      targetPort: http
      protocol: TCP
