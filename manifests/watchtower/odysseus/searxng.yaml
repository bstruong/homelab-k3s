---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: odysseus
  labels:
    app.kubernetes.io/name: searxng
data:
  settings.yml: |
    use_default_settings: true

    server:
      secret_key: "__SEARXNG_SECRET__"
      limiter: false

    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: odysseus
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.25-12f8b6515@sha256:5286edb35782454ab8a102c5eff6b54bff745853191b46aeead95f225aa6dfb6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -s /etc/searxng/settings.yml ] || grep -q '__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
                secret="$(/usr/local/searxng/.venv/bin/python -c 'import secrets; print(secrets.token_urlsafe(48))')"
                sed "s|__SEARXNG_SECRET__|${secret}|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
              fi
              exec /usr/local/searxng/entrypoint.sh
          env:
            - name: SEARXNG_BASE_URL
              value: http://searxng:8080/
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - DAC_OVERRIDE
          volumeMounts:
            - name: settings-template
              mountPath: /tmp/searxng-settings.yml.template
              subPath: settings.yml
              readOnly: true
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
      volumes:
        - name: settings-template
          configMap:
            name: searxng-settings
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: odysseus
  labels:
    app.kubernetes.io/name: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
