---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-http
  namespace: monitoring
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`status.watchtower.local`)
      services:
        - name: uptime-kuma
          port: 3001
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma-https
  namespace: monitoring
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`status.watchtower.local`)
      services:
        - name: uptime-kuma
          port: 3001
  tls: {}
