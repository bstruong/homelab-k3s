---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: monitoring
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup is set but does NOT fix ownership here: kubelet's recursive
        # ownership pass does not apply to hostPath volumes, so the directory
        # arrives owned by whoever created it on the node (root, via
        # DirectoryOrCreate). It is kept because it still governs the
        # supplementary group of the process. The init container below is what
        # actually fixes the volume.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image's entrypoint chowns /app/data to its own user. An
        # unprivileged process cannot chown a root-owned directory, so that
        # fails before the app starts. Fixing ownership up front makes the
        # entrypoint's chown a no-op — Linux permits chown to the *same* uid
        # without CAP_CHOWN — instead of an error.
        - name: fix-data-ownership
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 1000:1000 /app/data && echo 'ownership set to 1000:1000'"]
          securityContext:
            # Overrides the pod-level runAsNonRoot for this container only.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1.23.16
          env:
            - name: UPTIME_KUMA_PORT
              value: "3001"
            - name: NODE_ENV
              value: production
          ports:
            - name: http
              containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # ICMP ping monitors need raw sockets. Drop this if you only
              # ever use HTTP/TCP/DNS monitors.
              add: ["NET_RAW"]
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
