---
# CASTER's Postgres. Single-tenant: this instance exists only for CASTER, and
# nothing else connects to it. There is no shared Postgres on this cluster.
#
# Stock postgres:16 — CASTER needs no vector or uuid-ossp extensions, only plain
# SQL plus PERCENTILE_CONT, which is core Postgres.
#
# THREE databases are required, because config/database.yml declares three
# connections in production: primary (caster_production), cache
# (caster_production_cache) and queue (caster_production_queue), the latter two
# backing solid_cache and solid_queue. POSTGRES_DB creates exactly one, so the
# other two come from the init script in postgres-init-configmap.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: caster-postgres
  namespace: caster
  labels:
    app.kubernetes.io/name: caster-postgres
spec:
  serviceName: caster-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caster-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caster-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Self-healing volume permissions: DirectoryOrCreate and backup restores
        # may leave the host volume owned by root or an unprivileged user (e.g. 1000).
        # Postgres demands ownership by 999:999 and strict mode 0700.
        - name: fix-permissions
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data/pgdata
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: postgres
          # Pinned by digest: this is the exact postgres:16 image already
          # running under this database. Left as a floating :16, a node
          # rebuild or an image GC can re-resolve the tag and land a
          # different 16.x patch release under a live data directory with
          # no manifest change and no review. Re-pin deliberately when an
          # upgrade is actually wanted.
          image: docker.io/library/postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
          env:
            # Creating the superuser as `caster` rather than `postgres` matches
            # what Rails connects as: config/database.yml hardcodes
            # `username: caster` in the production block, not an env var.
            - name: POSTGRES_USER
              value: caster
            - name: POSTGRES_DB
              value: caster_production
            # PGDATA lives in a subdirectory of the mount on purpose: the
            # volume root is not empty (lost+found on ext4), and initdb refuses
            # to run in a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caster
                  key: postgres-password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Read on first init only; see postgres-init-configmap.yaml.
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          # -U caster, not -U postgres: no `postgres` role exists in this
          # instance, because POSTGRES_USER renamed the superuser.
          #
          # -d is not optional here. pg_isready defaults its dbname to the
          # USERNAME when omitted, and there is no database called `caster`
          # -- POSTGRES_DB is caster_production. Without -d every probe
          # opens a connection the server rejects, logging `FATAL:
          # database "caster" does not exist` every 10s forever. The probe
          # still passes (pg_isready returns 0 because the server answered),
          # so this is silent log noise rather than a health fault.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "caster", "-d", "caster_production"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "caster", "-d", "caster_production"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: initdb
          configMap:
            name: caster-postgres-initdb
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: appdata
        resources:
          requests:
            storage: 20Gi
