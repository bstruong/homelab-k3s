---
# antigravity.watchtower.local
#
# HTTPS-only with HTTP redirected, the CASTER / pocket-id / vaultwarden shape
# rather than the registry's serve-both-schemes one. The registry keeps a plain
# HTTP route because containerd needs it for the Basic-auth challenge flow;
# this is a browser-facing app with session cookies and has no such constraint.
#
# No forward-auth or OIDC middleware, deliberately: agy-server's own password
# auth is the access control, and the network is internal-only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: antigravity-redirect-https
  namespace: antigravity
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: antigravity-http
  namespace: antigravity
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`antigravity.watchtower.local`)
      middlewares:
        - name: antigravity-redirect-https
      services:
        - name: antigravity-server
          port: 8765
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: antigravity-https
  namespace: antigravity
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`antigravity.watchtower.local`)
      services:
        - name: antigravity-server
          port: 8765
          # The web UI streams: Server-Sent Events for agent output, WebSocket
          # for the editor channel, chunked bodies for uploads. Traefik proxies
          # WebSocket natively and does not buffer the way nginx does, so no
          # equivalent of nginx's `proxy_buffering off` is needed — but its
          # default flushInterval of 100ms would still batch SSE writes into
          # 100ms steps and make agent output visibly stutter. -1 flushes
          # immediately, matching the `flush_interval -1` in the project's own
          # deploy/Caddyfile.
          responseForwarding:
            flushInterval: "-1"
  tls:
    secretName: antigravity-tls
