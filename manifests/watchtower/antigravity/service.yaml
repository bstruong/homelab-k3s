---
# Plain ClusterIP. Nothing outside the cluster talks to this directly —
# Traefik is the only client, and the perimeter is the LAN plus TLS plus
# agy-server's own password, the CASTER arrangement.
apiVersion: v1
kind: Service
metadata:
  name: antigravity-server
  namespace: antigravity
  labels:
    app.kubernetes.io/name: antigravity-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: antigravity-server
  ports:
    - name: http
      port: 8765
      # The named port, not a bare 8765, so this stays correct if the
      # container's port ever moves.
      targetPort: http
