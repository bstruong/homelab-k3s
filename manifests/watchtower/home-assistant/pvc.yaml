---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-config
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/home-assistant
    type: DirectoryOrCreate
  claimRef:
    namespace: home
    name: home-assistant-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
# Contains .storage/, which holds the user database, long-lived tokens and
# every integration's credentials. Treat a backup of this as sensitive.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: appdata
  volumeName: home-assistant-config
  resources:
    requests:
      storage: 20Gi
