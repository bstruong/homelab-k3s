---
# tailscale's containerboot decides it is "in Kubernetes" from the presence of
# KUBERNETES_SERVICE_HOST — which is always set inside a pod — and then
# initializes a Kubernetes client before it looks at TS_KUBE_SECRET. That
# client reads /var/run/secrets/kubernetes.io/serviceaccount/namespace, so the
# pod needs a projected ServiceAccount token to start at all, even though it
# stores its state on a PVC and never touches the API.
#
# Deliberately no Role or RoleBinding: this ServiceAccount is granted nothing.
# It exists so the token files are present. If you ever switch state storage to
# a Kubernetes Secret (TS_KUBE_SECRET), you would need to add a Role allowing
# get/create/update on that one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tailscale
automountServiceAccountToken: false
