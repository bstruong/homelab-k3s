---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tailscale-state
  labels:
    app.kubernetes.io/name: tailscale
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/tailscale
    type: DirectoryOrCreate
  claimRef:
    namespace: kube-system
    name: tailscale-state
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
# Holds the node key. Losing it is not fatal — the node re-authenticates with
# the auth key — but it will re-register as a new machine in the tailnet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tailscale-state
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tailscale
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: appdata
  volumeName: tailscale-state
  resources:
    requests:
      storage: 1Gi
