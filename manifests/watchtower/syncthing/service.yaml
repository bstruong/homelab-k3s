---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: sync
  labels:
    app.kubernetes.io/name: syncthing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: syncthing
  ports:
    - name: gui
      port: 8384
      targetPort: gui
---
# The sync protocol is peer-to-peer: other devices connect in on 22000, and
# local discovery broadcasts on 21027. Both have to be reachable from the LAN,
# so they go through the node rather than the ingress.
apiVersion: v1
kind: Service
metadata:
  name: syncthing-sync
  namespace: sync
  labels:
    app.kubernetes.io/name: syncthing
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: syncthing
  ports:
    - name: sync-tcp
      port: 22000
      targetPort: sync-tcp
      protocol: TCP
    - name: sync-udp
      port: 22000
      targetPort: sync-udp
      protocol: UDP
    - name: discovery
      port: 21027
      targetPort: discovery
      protocol: UDP
