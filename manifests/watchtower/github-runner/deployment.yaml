---
# GitHub Actions self-hosted runner for Sapphire (and later private repos).
#
# Security exceptions (AGENTS.md / README exception table):
#   - runAsNonRoot: false / privileged: true / START_DOCKER_SERVICE
#     Actions *service containers* (Sapphire mutation Postgres) require a
#     working Docker engine inside the runner. Watchtower is k3s/containerd
#     with no host docker.sock, so dockerd runs in-process via
#     START_DOCKER_SERVICE=true. That needs a privileged container.
#   - infra namespace PSA enforce=privileged (see manifests/common/namespaces.yaml)
#     baseline would reject this pod.
#   - Private repos only. Never attach this runner to a public repository.
#
# Secret (owner must seal — never invent tokens):
#   github-runner-token / key `token`  →  RUNNER_TOKEN (registration token)
# Prefer a durable PAT mapped as ACCESS_TOKEN; see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-sapphire
  namespace: infra
  labels:
    app.kubernetes.io/name: github-runner-sapphire
spec:
  replicas: 1
  strategy:
    # Single hostPath work + cache dirs — never two pods at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-sapphire
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner-sapphire
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      # No dedicated ServiceAccount/RBAC: the runner talks only to GitHub
      # over outbound HTTPS. It must not hold a cluster identity.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /cache /_work
              chmod 755 /cache /_work
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: runner-cache
              mountPath: /cache
            - name: runner-work
              mountPath: /_work
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: runner
          image: myoung34/github-runner:ubuntu-noble
          env:
            - name: REPO_URL
              value: "https://github.com/bstruong/sapphire"
            - name: RUNNER_SCOPE
              value: "repo"
            # Registration token from sealed secret. Short-lived (~1h).
            # For EPHEMERAL restarts, reseal a fresh token or switch to ACCESS_TOKEN
            # (documented in README.md). Do not invent a placeholder value.
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-token
                  key: token
            - name: RUNNER_NAME
              value: "watchtower-9700x-01"
            # Upstream image env is LABELS (not RUNNER_LABELS).
            - name: LABELS
              value: "self-hosted,watchtower,x64,zen5"
            - name: EPHEMERAL
              value: "1"
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            # Starts dockerd inside the container so Actions service containers
            # (Postgres for sapphire mutation) work. Requires privileged.
            - name: START_DOCKER_SERVICE
              value: "true"
            - name: RUNNER_WORKDIR
              value: /_work
            - name: UV_CACHE_DIR
              value: /cache/uv
            - name: XDG_CACHE_HOME
              value: /cache/xdg
            - name: NPM_CONFIG_CACHE
              value: /cache/npm
            # Circuit breaker: mutation uses host Postgres (not Actions services).
            # Pods reach the node-published :54329 via this IP (see README).
            - name: WATCHTOWER_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            # myoung34 defaults to root; dockerd via START_DOCKER_SERVICE needs it.
            runAsNonRoot: false
          volumeMounts:
            - name: runner-cache
              mountPath: /cache
            - name: runner-work
              mountPath: /_work
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              # Bursts up to 12 Zen 5 threads; leaves headroom for JARVIS sleepy-warm.
              cpu: "12000m"
              memory: "12Gi"
      volumes:
        - name: runner-cache
          hostPath:
            path: /mnt/appdata/ci-cache
            type: DirectoryOrCreate
        - name: runner-work
          hostPath:
            path: /mnt/appdata/ci-runner-work
            type: DirectoryOrCreate
