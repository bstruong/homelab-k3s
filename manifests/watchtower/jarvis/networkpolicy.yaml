---
# Ingress lock for llama-server. Mirrors vaultwarden/pocket-id: Traefik plus
# node/CNI sources for probes, ClusterIP clients, and loopback hostPort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jarvis-ingress
  namespace: jarvis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jarvis
  policyTypes:
    - Ingress
  ingress:
    # 1. Allow Traefik Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # 2. Allow Node / CNI gateway / cluster subnet for probes, in-cluster
    #    clients (Alpha, etc.), and 127.0.0.1 hostPort consumers.
    - from:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 192.168.1.92/32
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 8080
