# DEPRECATED during Phase 4 cutover — dual-read only.
# Primary ownership is coordination.k8s.io/v1 Lease jarvis-gpu (lease.yaml).
# scripts/jarvis-*.sh still mirror holder/expiry here so legacy Alpha kick/status
# keep working. Delete this object and set JARVIS_LEASE_DUAL_READ=0 after the
# Alpha launcher cutover validates end-to-end.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-lease
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
  annotations:
    jarvis.watchtower/holder: ""
    jarvis.watchtower/expires-at: ""
    jarvis.watchtower/run-id: ""
data:
  # Placeholder key so the object is a valid ConfigMap; state lives in annotations.
  status: idle
