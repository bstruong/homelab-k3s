# JARVIS preset SoT. Section names are OpenAI model ids clients send.
# Folded from former alpha-llama CLI flags, Alpha engine/models.ini, and the
# gemma-llama router ConfigMap. Paths are in-pod (/models), not host (/mnt/models).
#
# One resident GGUF: --models-max 1. No load-on-startup house model yet —
# sleepy-warm prefers cold start over pinning VRAM overnight.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-models
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
data:
  models.ini: |
    version = 1

    [*]
    n-gpu-layers = all
    threads = 8
    threads-batch = 14
    cpu-mask = 00ff
    poll = 100
    parallel = 1
    batch-size = 2048
    ubatch-size = 1024
    cache-reuse = 64
    flash-attn = on
    load-mode = mlock
    cache-type-k = q8_0
    cache-type-v = q8_0
    jinja = true
    metrics = true
    slots = true

    [qwen25-coder-14b]
    model = /models/qwen2.5-coder-14b-instruct-q4_k_m.gguf
    alias = qwen25-coder-14b,qwen2.5-coder-14b
    ctx-size = 16384
    parallel = 1

    ; Single section for Qwen 3.6 35B MoE so router (--models-max 1) never
    ; evicts and reloads the 22 GB GGUF when switching between alias names.
    [qwen36-coder-hybrid]
    model = /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
    alias = qwen36-coder-hybrid,qwen36-coder
    ctx-size = 262144
    parallel = 1
    n-cpu-moe = 27
    cache-type-k = q4_0
    cache-type-v = q4_0
    threads = 8
    threads-batch = 14
    cpu-mask = 00ff
    poll = 100
    spec-type = ngram-mod
    spec-draft-n-max = 8
    spec-ngram-mod-n-min = 1
    spec-ngram-mod-n-max = 8
    spec-ngram-mod-n-match = 16
    cache-reuse = 64
    ubatch-size = 1024
    ctx-checkpoints = 4
    checkpoint-min-step = 2048

    [glm47-reap]
    model = /models/GLM-4.7-Flash-REAP-23B-A3B-Q4_K_M.gguf
    alias = glm47-reap,glm-4.7-flash
    ctx-size = 131072
    parallel = 2
    cpu-moe = true

    ; Single section for the E4B GGUF (duplicate [gemma4-e4b] alias conflict).
    [gemma4-4b]
    model = /models/gemma-4-e4b-it-q4_k_m.gguf
    alias = gemma4-4b,gemma4-e4b,gemma-4-e4b,gemma-4-4b
    ctx-size = 16384
    parallel = 1

    [gemma4-12b]
    model = /models/gemma-4-12b-it-q4_k_m.gguf
    alias = gemma4-12b,gemma-4-12b,gemma-12b
    ctx-size = 16384
    parallel = 1

    [gemma4-27b]
    model = /models/gemma-4-26b-a4b-it-q4_k_m.gguf
    alias = gemma4-27b,gemma-4-27b,gemma-4-26b-a4b,gemma4-26b
    ctx-size = 32768
    parallel = 1
    cpu-moe = true

    [qwen38-27b-ista-2b]
    model = /models/Qwen3.8-27B-GSQ-RCO-IQ2_XS.gguf
    alias = qwen38-27b,qwen38-27b-ista-2b,qwen3.8-27b-ista-2b
    ctx-size = 16384
    parallel = 1
    cache-type-k = q4_0
    cache-type-v = q4_0
    fit-target = 1024

    [qwen38-27b-ista-3b]
    model = /models/Qwen3.8-27B-GSQ-RCO-IQ3_XXS.gguf
    alias = qwen38-27b-ista-3b,qwen3.8-27b-ista-3b
    ctx-size = 8192
    parallel = 1
    cache-type-k = q4_0
    cache-type-v = q4_0
    fit-target = 1024
