# ServiceAccount for the idle safety reconciler (expire stale Lease, scale 0).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-idle
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jarvis-idle
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
rules:
  # Scale only — never mutate the parent Deployment pod template.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["jarvis"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["jarvis"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["jarvis-gpu"]
    verbs: ["get", "patch", "update"]
  # Dual-read/mirror during ConfigMap cutover; remove after Alpha validates.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["jarvis-lease"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jarvis-idle
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jarvis-idle
subjects:
  - kind: ServiceAccount
    name: jarvis-idle
    namespace: jarvis
