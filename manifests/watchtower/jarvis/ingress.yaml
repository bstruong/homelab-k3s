# Former ai.watchtower.local route for alpha-llama now points at JARVIS.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-http
  namespace: jarvis
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`ai.watchtower.local`)
      services:
        - name: jarvis
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-https
  namespace: jarvis
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`ai.watchtower.local`)
      services:
        - name: jarvis
          port: 8080
  tls:
    secretName: jarvis-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-named-http
  namespace: jarvis
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`jarvis.watchtower.local`)
      services:
        - name: jarvis
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jarvis-named-https
  namespace: jarvis
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`jarvis.watchtower.local`)
      services:
        - name: jarvis
          port: 8080
  tls:
    secretName: jarvis-tls
