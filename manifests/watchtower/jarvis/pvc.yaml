# Read-only view of /mnt/models on Watchtower. GGUF weights stay on the host;
# this claim only mounts them. claimRef pins the PV to jarvis so alpha-models
# / gemma-models cannot steal the binding after cutover.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jarvis-models
  labels:
    app.kubernetes.io/name: jarvis-models
spec:
  capacity:
    storage: 400Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/models
    type: Directory
  claimRef:
    namespace: jarvis
    name: jarvis-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-models
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis-models
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: appdata
  volumeName: jarvis-models
  resources:
    requests:
      storage: 400Gi
