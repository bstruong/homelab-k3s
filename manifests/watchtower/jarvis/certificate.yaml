apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jarvis-tls
  namespace: jarvis
spec:
  secretName: jarvis-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - ai.watchtower.local
    - jarvis.watchtower.local
  issuerRef:
    name: watchtower-ca-issuer
    kind: ClusterIssuer
