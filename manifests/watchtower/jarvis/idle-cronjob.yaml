# Sleepy-warm idle reclaim. Every 10 minutes:
# 1) If replicas>0, sample llama.cpp /metrics. Growing token counters or
#    in-flight requests refresh jarvis.watchtower/last-activity-at so real
#    inference traffic (not only jarvis-up / lease scripts) keeps the GPU warm.
# 2) If no active lease and last-activity is older than IDLE_TTL_MINUTES, scale
#    to 0.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jarvis-idle-sleep
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jarvis-idle
        spec:
          serviceAccountName: jarvis-idle
          restartPolicy: Never
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: idle-sleep
              # bitnami/kubectl:1.31 was removed from Docker Hub; legacy mirror
              # still publishes the 1.31 tag used by the idle-sleep script.
              image: bitnamilegacy/kubectl:1.31
              imagePullPolicy: IfNotPresent
              env:
                - name: IDLE_TTL_MINUTES
                  value: "60"
                - name: JARVIS_METRICS_HOST
                  value: "jarvis.jarvis.svc.cluster.local"
                - name: JARVIS_METRICS_PORT
                  value: "8080"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  NS=jarvis
                  DEP=jarvis
                  CM=jarvis-lease
                  now_rfc() { date -u +%Y-%m-%dT%H:%M:%SZ; }

                  # Fetch prometheus text from llama-server via bash /dev/tcp
                  # (bitnami kubectl image has no curl).
                  fetch_metrics() {
                    local host="$1" port="$2" out
                    out="$(
                      timeout 5 bash -c '
                        set -e
                        exec 3<>/dev/tcp/'"$host"'/'"$port"'
                        printf "GET /metrics HTTP/1.0\r\nHost: %s\r\n\r\n" "'"$host"'" >&3
                        cat <&3
                      ' 2>/dev/null
                    )" || return 1
                    # Strip HTTP headers (HTTP/1.0 response)
                    printf '%s' "$out" | awk 'BEGIN{h=1} h&&$0==""{h=0;next} !h{print}'
                  }

                  # Prefer cumulative token counters; fall back to processing gauge.
                  metrics_warmth_score() {
                    local body="$1" predicted processing prompt score
                    predicted="$(printf '%s\n' "$body" | awk '/^llamacpp(:|_)tokens_predicted_total/ {s+=$2} END {printf "%.0f", s+0}')"
                    prompt="$(printf '%s\n' "$body" | awk '/^llamacpp(:|_)prompt_tokens_total/ {s+=$2} END {printf "%.0f", s+0}')"
                    processing="$(printf '%s\n' "$body" | awk '/^llamacpp(:|_)requests_processing/ {s+=$2} END {printf "%.0f", s+0}')"
                    score=$(( predicted + prompt ))
                    if (( processing > 0 )); then
                      # In-flight work always counts as activity this tick.
                      score=$(( score + processing + 1 ))
                    fi
                    echo "$score"
                  }

                  warm_from_inference_traffic() {
                    local body score prev
                    body="$(fetch_metrics "${JARVIS_METRICS_HOST}" "${JARVIS_METRICS_PORT}" || true)"
                    if [[ -z "${body}" ]]; then
                      echo "metrics unreachable — skip traffic warmth"
                      return 0
                    fi
                    score="$(metrics_warmth_score "$body")"
                    prev="$(kubectl -n "$NS" get configmap "$CM" -o jsonpath='{.metadata.annotations.jarvis\.watchtower/metrics-warmth-score}' || true)"
                    prev="${prev:-0}"
                    if (( score > prev )); then
                      echo "inference traffic detected (score ${score} > ${prev}) — refresh last-activity"
                      kubectl -n "$NS" annotate configmap "$CM" \
                        "jarvis.watchtower/last-activity-at=$(now_rfc)" \
                        "jarvis.watchtower/metrics-warmth-score=${score}" \
                        --overwrite
                    else
                      # Persist baseline so the next tick can detect growth.
                      kubectl -n "$NS" annotate configmap "$CM" \
                        "jarvis.watchtower/metrics-warmth-score=${score}" \
                        --overwrite
                      echo "no new inference traffic (score ${score})"
                    fi
                  }

                  replicas="$(kubectl -n "$NS" get deployment "$DEP" -o jsonpath='{.spec.replicas}')"
                  if [[ "${replicas:-0}" == "0" ]]; then
                    echo "jarvis already scaled to 0"
                    exit 0
                  fi

                  warm_from_inference_traffic

                  holder="$(kubectl -n "$NS" get configmap "$CM" -o jsonpath='{.metadata.annotations.jarvis\.watchtower/holder}' || true)"
                  expires="$(kubectl -n "$NS" get configmap "$CM" -o jsonpath='{.metadata.annotations.jarvis\.watchtower/expires-at}' || true)"
                  now="$(now_rfc)"
                  if [[ -n "${holder}" && -n "${expires}" && "${expires}" > "${now}" ]]; then
                    echo "active lease holder=${holder} expires=${expires} — skip sleep"
                    exit 0
                  fi

                  last="$(kubectl -n "$NS" get configmap "$CM" -o jsonpath='{.metadata.annotations.jarvis\.watchtower/last-activity-at}' || true)"
                  if [[ -z "${last}" ]]; then
                    echo "no last-activity-at — treating as idle, scaling to 0"
                    kubectl -n "$NS" scale deployment/"$DEP" --replicas=0
                    exit 0
                  fi

                  last_epoch="$(date -u -d "${last}" +%s)"
                  now_epoch="$(date -u +%s)"
                  age_min=$(( (now_epoch - last_epoch) / 60 ))
                  if (( age_min < IDLE_TTL_MINUTES )); then
                    echo "last activity ${age_min}m ago < TTL ${IDLE_TTL_MINUTES}m — skip sleep"
                    exit 0
                  fi

                  echo "scaling jarvis to 0 (idle ${age_min}m, no lease)"
                  kubectl -n "$NS" scale deployment/"$DEP" --replicas=0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
