# Safety reconciler only. Campaign Jobs own acquire/wake/heartbeat/release via
# jarvis-session.sh. This CronJob expires stale Leases and reclaim idle GPU
# replicas. Unreachable metrics must never destroy a potentially active workload
# (see scripts/jarvis-reconcile-idle.sh fail-safe exits).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jarvis-idle-sleep
  namespace: jarvis
  labels:
    app.kubernetes.io/name: jarvis
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jarvis-idle
        spec:
          serviceAccountName: jarvis-idle
          restartPolicy: Never
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: idle-reconcile
              # bitnami/kubectl:1.31 was removed from Docker Hub; legacy mirror
              # still publishes the 1.31 tag used by the idle-sleep script.
              image: bitnamilegacy/kubectl:1.31
              imagePullPolicy: IfNotPresent
              env:
                - name: IDLE_TTL_MINUTES
                  value: "60"
                - name: JARVIS_METRICS_HOST
                  value: "jarvis.jarvis.svc.cluster.local"
                - name: JARVIS_METRICS_PORT
                  value: "8080"
                - name: JARVIS_LEASE_DUAL_READ
                  value: "1"
              command: ["/bin/bash", "/scripts/jarvis-reconcile-idle.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: jarvis-idle-reconcile
                defaultMode: 0755
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
