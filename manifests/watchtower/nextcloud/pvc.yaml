---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/nextcloud/html
    type: DirectoryOrCreate
  claimRef:
    namespace: docs
    name: nextcloud-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: docs
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: appdata
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-postgres
  labels:
    app.kubernetes.io/name: nextcloud-postgres
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/nextcloud/postgres
    type: DirectoryOrCreate
  claimRef:
    namespace: docs
    name: data-nextcloud-postgres-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
