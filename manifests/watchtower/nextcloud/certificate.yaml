---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-tls
  namespace: docs
spec:
  secretName: nextcloud-tls
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  dnsNames:
    - drive.watchtower.local
  issuerRef:
    name: watchtower-ca-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: collabora-tls
  namespace: docs
spec:
  secretName: collabora-tls
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  dnsNames:
    - office.watchtower.local
  issuerRef:
    name: watchtower-ca-issuer
    kind: ClusterIssuer
