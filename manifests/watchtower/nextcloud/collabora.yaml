---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-collabora
  namespace: docs
  labels:
    app.kubernetes.io/name: nextcloud-collabora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-collabora
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collabora
          image: collabora/code:24.04.10.2.1
          env:
            - name: aliasgroup1
              value: "https://drive.watchtower.local:443"
            - name: extra_params
              value: "--o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:net.proto=IPv4 --o:mount_jail_tree=false --o:mount_namespaces=false"
            - name: dictionaries
              value: "en_US"
          ports:
            - name: http
              containerPort: 9980
          securityContext:
            capabilities:
              add: ["SYS_CHROOT", "MKNOD", "FOWNER", "CHOWN"]
          livenessProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-collabora
  namespace: docs
  labels:
    app.kubernetes.io/name: nextcloud-collabora
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextcloud-collabora
  ports:
    - name: http
      port: 9980
      targetPort: http
