---
# Alpha runner is an egress client (JARVIS, ntfy, git, registry). No ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alpha-runner-egress
  namespace: alpha
  labels:
    app.kubernetes.io/name: alpha-runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alpha-runner
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API (in-cluster SA for jarvis-up / lease)
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # JARVIS inference
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jarvis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jarvis
      ports:
        - protocol: TCP
          port: 8080
    # ntfy completion notify
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ntfy
      ports:
        - protocol: TCP
          port: 8080
    # HTTPS (git, registry.watchtower.local, Traefik)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5000
