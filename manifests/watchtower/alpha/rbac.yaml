---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-runner
  namespace: alpha
  labels:
    app.kubernetes.io/name: alpha-runner
---
# Cross-namespace: scale JARVIS and operate the named GPU Lease.
# Never patch the parent Deployment (pod template / privileged escape).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alpha-runner-jarvis
  namespace: jarvis
  labels:
    app.kubernetes.io/name: alpha-runner
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["jarvis"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["jarvis"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["jarvis-gpu"]
    verbs: ["get", "list", "patch", "update"]
  # Cutover only: dual-read + mirror holder onto legacy ConfigMap so old kick/status
  # keep working. Remove this rule (and lease-configmap.yaml) after Alpha validates.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["jarvis-lease"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha-runner-jarvis
  namespace: jarvis
  labels:
    app.kubernetes.io/name: alpha-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alpha-runner-jarvis
subjects:
  - kind: ServiceAccount
    name: alpha-runner
    namespace: alpha
