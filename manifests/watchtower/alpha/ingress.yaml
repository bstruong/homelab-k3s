---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alpha-llama-http
  namespace: alpha
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`ai.watchtower.local`)
      services:
        - name: alpha-llama
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alpha-llama-https
  namespace: alpha
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`ai.watchtower.local`)
      services:
        - name: alpha-llama
          port: 8080
  tls:
    secretName: alpha-llama-tls
