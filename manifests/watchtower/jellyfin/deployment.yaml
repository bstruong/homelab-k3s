---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seed encoding.xml only if Jellyfin has not written one yet, so the
        # ConfigMap never clobbers later changes made in the web UI.
        - name: seed-encoding-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/config
              if [ ! -f /config/config/encoding.xml ]; then
                cp /seed/encoding.xml /config/config/encoding.xml
                echo "seeded encoding.xml (Direct Play defaults)"
              else
                echo "encoding.xml already present, leaving it alone"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: encoding-seed
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.10.3
          env:
            - name: JELLYFIN_CONFIG_DIR
              value: /config/config
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_CACHE_DIR
              value: /cache
            - name: JELLYFIN_LOG_DIR
              value: /config/log
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            # Direct Play only, so this ceiling should never be approached.
            # If it is, something is transcoding — check the playback dashboard.
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: encoding-seed
          configMap:
            name: jellyfin-encoding
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir: {}
