---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/jellyfin
    type: DirectoryOrCreate
  claimRef:
    namespace: media
    name: jellyfin-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: appdata
  volumeName: jellyfin-config
  resources:
    requests:
      storage: 20Gi
---
# The media library. Ideally this would live on its own disk, separate from
# application state — but /mnt/appdata (the 1TB SSD) is currently the only large
# filesystem on this node, and the root partition has under 3GB free. Putting the
# library on / would re-trigger the disk-pressure taint that moved k3s's data
# here in the first place.
#
# Point this at a dedicated mount if one is ever added; nothing else depends on
# the path. `type: Directory` (not DirectoryOrCreate) is deliberate — a missing
# library should fail the mount loudly rather than silently serving an empty one.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  capacity:
    storage: 1Ti
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/media
    type: Directory
  claimRef:
    namespace: media
    name: jellyfin-media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: appdata
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 1Ti
