---
# Immich uses Redis as its job queue (BullMQ) and cache. It holds only
# transient job state, so it runs on an emptyDir with persistence switched
# off — exactly the paperless-redis arrangement next door in `docs`. Losing it
# costs at most in-flight background jobs, which Immich re-queues.
#
# redis:7.4-alpine, not the valkey:9 upstream's compose file uses. Immich needs
# nothing Valkey-specific — no modules, no unusual configuration, just a plain
# queue — and this repo already standardises on this image and these args for
# per-app Redis. Matching the repo is worth more here than matching upstream.
#
# Dedicated rather than pointed at paperless-redis: same reasoning as the
# Postgres beside it. Sharing would couple Immich's job queue to another app's
# namespace and lifecycle, and DB index collisions would be silent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          # No persistence: no RDB snapshots, no AOF.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
