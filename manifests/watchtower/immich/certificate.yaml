---
# TLS for immich, issued and auto-renewed by cert-manager — the same shape
# every other service in this repo uses.
#
# 90-day lifetime, renewed 15 days before expiry. cert-manager writes
# leaf + intermediate into tls.crt; clients trust only the root, so the
# intermediate must be presented for the chain to build.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-tls
  namespace: immich
spec:
  secretName: immich-tls
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  dnsNames:
    - immich.watchtower.local
  issuerRef:
    name: watchtower-ca-issuer
    kind: ClusterIssuer
