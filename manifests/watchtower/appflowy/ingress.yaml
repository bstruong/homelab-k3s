---
# Routing mirrors the path split in upstream's nginx/nginx.conf
# (AppFlowy-IO/AppFlowy-Cloud): the API backend owns a fixed set of path
# prefixes and the web UI serves everything else.
#
#   /gotrue  -> appflowy-gotrue  (prefix stripped)
#   /api     -> appflowy-cloud   (REST; also covers /api/chat, /api/import and
#                                 /api/workspace/*/publish, which upstream only
#                                 splits out to tune buffering, not to reroute)
#   /ws      -> appflowy-cloud   (websocket; clients connect to /ws/v2)
#   /ai      -> appflowy-cloud
#   /        -> appflowy-web
#
# Route order matters — the more specific rules need the higher priority.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: appflowy-gotrue-stripprefix
  namespace: docs
spec:
  stripPrefix:
    prefixes:
      - /gotrue
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: appflowy-http
  namespace: docs
spec:
  entryPoints: ["web"]
  routes:
    - kind: Rule
      match: Host(`appflowy.watchtower.local`) && PathPrefix(`/gotrue`)
      priority: 20
      middlewares:
        - name: appflowy-gotrue-stripprefix
      services:
        - name: appflowy-gotrue
          port: 9999
    - kind: Rule
      match: Host(`appflowy.watchtower.local`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/ai`))
      priority: 20
      services:
        - name: appflowy-cloud
          port: 8000
    - kind: Rule
      match: Host(`appflowy.watchtower.local`)
      priority: 10
      services:
        - name: appflowy-web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: appflowy-https
  namespace: docs
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`appflowy.watchtower.local`) && PathPrefix(`/gotrue`)
      priority: 20
      middlewares:
        - name: appflowy-gotrue-stripprefix
      services:
        - name: appflowy-gotrue
          port: 9999
    - kind: Rule
      match: Host(`appflowy.watchtower.local`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/ai`))
      priority: 20
      services:
        - name: appflowy-cloud
          port: 8000
    - kind: Rule
      match: Host(`appflowy.watchtower.local`)
      priority: 10
      services:
        - name: appflowy-web
          port: 80
  tls:
    secretName: appflowy-tls
