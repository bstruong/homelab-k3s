---
# AppFlowy Cloud's backing Postgres. It needs the pgvector and uuid-ossp
# extensions, hence the pgvector image rather than stock postgres.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: appflowy-postgres
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy-postgres
spec:
  serviceName: appflowy-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appflowy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appflowy-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid of the postgres user inside the image.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy
                  key: postgres-password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: appdata
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: appflowy-postgres
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy-postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: appflowy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
