---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy
data:
  APPFLOWY_ENVIRONMENT: production
  # Required — appflowy-cloud refuses to start without it, with
  # "Failed to read configuration: APPFLOWY_WEB_URL has not been set". It is the
  # externally reachable base URL, so it must match the IngressRoute host rather
  # than any in-cluster Service name.
  APPFLOWY_WEB_URL: https://appflowy.watchtower.local
  # The same externally reachable base URL, read by the periodic license check.
  # Without it appflowy-cloud logs "Check license error: APPFLOWY_BASE_URL is
  # not set" every 30s. Upstream deploy.env defines both as ${SCHEME}://${FQDN},
  # so the two values are intentionally identical.
  APPFLOWY_BASE_URL: https://appflowy.watchtower.local
  APPFLOWY_REDIS_URI: redis://appflowy-redis:6379
  APPFLOWY_GOTRUE_BASE_URL: http://appflowy-gotrue:9999
  APPFLOWY_GOTRUE_JWT_EXP: "7200"
  APPFLOWY_ACCESS_CONTROL: "true"
  APPFLOWY_WEBSOCKET_MAILBOX_SIZE: "6000"
  APPFLOWY_DATABASE_MAX_CONNECTIONS: "20"
  # Object storage — swap these for a real S3 endpoint if you outgrow MinIO.
  APPFLOWY_S3_USE_MINIO: "true"
  APPFLOWY_S3_MINIO_URL: http://appflowy-minio:9000
  APPFLOWY_S3_BUCKET: appflowy
  APPFLOWY_S3_REGION: us-east-1
  RUST_LOG: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-gotrue
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy-gotrue
data:
  PORT: "9999"
  GOTRUE_DB_DRIVER: postgres
  API_EXTERNAL_URL: https://appflowy.watchtower.local/gotrue
  GOTRUE_SITE_URL: appflowy-flutter://
  GOTRUE_URI_ALLOW_LIST: "**"
  GOTRUE_JWT_EXP: "7200"
  GOTRUE_JWT_AUD: authenticated
  # No SMTP server in the homelab, so new accounts are confirmed immediately.
  # Signups are closed by default — invite users from the admin console.
  GOTRUE_MAILER_AUTOCONFIRM: "true"
  GOTRUE_DISABLE_SIGNUP: "true"
  GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
  GOTRUE_ADMIN_EMAIL: admin@watchtower.local
