---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: appflowy-postgres
  labels:
    app.kubernetes.io/name: appflowy-postgres
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/appflowy/postgres
    type: DirectoryOrCreate
  claimRef:
    namespace: docs
    # StatefulSet volumeClaimTemplates generate PVC names of the form
    # <template>-<statefulset>-<ordinal>.
    name: data-appflowy-postgres-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: appflowy-minio
  labels:
    app.kubernetes.io/name: appflowy-minio
spec:
  capacity:
    storage: 50Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/appflowy/minio
    type: DirectoryOrCreate
  claimRef:
    namespace: docs
    name: appflowy-minio
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appflowy-minio
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy-minio
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: appdata
  volumeName: appflowy-minio
  resources:
    requests:
      storage: 50Gi
