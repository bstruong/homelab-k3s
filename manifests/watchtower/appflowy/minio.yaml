---
# AppFlowy Cloud stores file attachments in S3-compatible object storage.
# MinIO provides that locally; swap APPFLOWY_S3_* in configmap.yaml if you
# would rather point at a real S3 bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-minio
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: appflowy-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appflowy-minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: appflowy
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy
                  key: minio-secret-key
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: appflowy-minio
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: appflowy-minio
  namespace: docs
  labels:
    app.kubernetes.io/name: appflowy-minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: appflowy-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
