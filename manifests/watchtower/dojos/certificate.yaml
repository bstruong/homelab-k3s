---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dsa-dojo-tls
  namespace: dojo
spec:
  secretName: dsa-dojo-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - dsa-dojo.watchtower.local
  issuerRef:
    kind: ClusterIssuer
    name: watchtower-ca-issuer
