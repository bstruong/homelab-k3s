---
apiVersion: v1
kind: Service
metadata:
  name: dojos-static
  namespace: dojo
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8880
      protocol: TCP
      targetPort: 8880
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dojos-static
  namespace: dojo
subsets:
  - addresses:
      - ip: 192.168.1.92
    ports:
      - name: http
        port: 8880
---
apiVersion: v1
kind: Service
metadata:
  name: python-dojo
  namespace: dojo
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8888
      protocol: TCP
      targetPort: 8888
---
apiVersion: v1
kind: Endpoints
metadata:
  name: python-dojo
  namespace: dojo
subsets:
  - addresses:
      - ip: 192.168.1.92
    ports:
      - name: http
        port: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: ruby-dojo
  namespace: dojo
spec:
  clusterIP: None
