---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dsa-dojo-http
  namespace: dojo
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`dsa-dojo.watchtower.local`)
      middlewares:
        - name: dsa-dojo-prefix
      services:
        - name: dojos-static
          port: 8880
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dsa-dojo-https
  namespace: dojo
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dsa-dojo.watchtower.local`)
      middlewares:
        - name: dsa-dojo-prefix
      services:
        - name: dojos-static
          port: 8880
  tls:
    secretName: dsa-dojo-tls
