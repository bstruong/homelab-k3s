---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-ngx
  namespace: docs
  labels:
    app.kubernetes.io/name: paperless-ngx
data:
  # --- Worker concurrency: pinned to 1 across the board -------------------
  # One Celery worker, one thread inside it, one gunicorn web worker. This
  # keeps OCR from saturating the node; documents are processed serially.
  PAPERLESS_TASK_WORKERS: "1"
  PAPERLESS_THREADS_PER_WORKER: "1"
  PAPERLESS_WEBSERVER_WORKERS: "1"
  # -----------------------------------------------------------------------
  PAPERLESS_REDIS: redis://paperless-redis:6379
  PAPERLESS_URL: https://paperless.watchtower.local
  PAPERLESS_PORT: "8000"
  PAPERLESS_TIME_ZONE: America/Los_Angeles
  PAPERLESS_OCR_LANGUAGE: eng
  PAPERLESS_OCR_MODE: skip
  PAPERLESS_DATA_DIR: /data
  PAPERLESS_MEDIA_ROOT: /media
  PAPERLESS_CONSUMPTION_DIR: /consume
  PAPERLESS_EXPORT_DIR: /export
  PAPERLESS_CONSUMER_POLLING: "60"
  PAPERLESS_CONSUMER_RECURSIVE: "true"
  PAPERLESS_FILENAME_FORMAT: "{{ created_year }}/{{ correspondent }}/{{ title }}"
  # The app is behind Traefik, which terminates TLS.
  PAPERLESS_USE_X_FORWARD_HOST: "true"
  PAPERLESS_USE_X_FORWARD_PORT: "true"
  USERMAP_UID: "1000"
  USERMAP_GID: "1000"
