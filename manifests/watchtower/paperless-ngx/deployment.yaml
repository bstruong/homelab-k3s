---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: docs
  labels:
    app.kubernetes.io/name: paperless-ngx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The image's entrypoint expects to own its data directories. It runs
        # unprivileged here, so create the layout up front with the right
        # ownership (fsGroup handles the group bit) instead of letting the
        # entrypoint attempt a chown it cannot perform.
        - name: init-dirs
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data /media /consume /export && echo ok"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /media
              subPath: media
            - name: data
              mountPath: /consume
              subPath: consume
            - name: data
              mountPath: /export
              subPath: export
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # Paperless makes an outbound HTTPS call to Pocket ID during OIDC
        # discovery. The image ships only the public CA set, so concatenate the
        # homelab root CA onto the system bundle here and mount the result over
        # the original in the main container. Uses the app image so the base
        # bundle is exactly the one the runtime container would have used.
        - name: ca-trust
          image: ghcr.io/paperless-ngx/paperless-ngx:2.13.5
          command: ["/bin/sh", "-c"]
          args:
            - cat /etc/ssl/certs/ca-certificates.crt /ca/ca.crt > /ca-bundle/ca-certificates.crt
          volumeMounts:
            - name: homelab-ca
              mountPath: /ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-bundle
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:2.13.5
          envFrom:
            - configMapRef:
                name: paperless-ngx
          env:
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx
                  key: secret-key
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx
                  key: admin-user
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx
                  key: admin-password
            # django-allauth fetches the OIDC discovery document with
            # python-requests, which verifies against certifi's own bundle
            # (/usr/local/lib/python3.12/site-packages/certifi/cacert.pem), NOT
            # the system trust store. Mounting the merged bundle alone is
            # therefore not enough — without this variable discovery still fails
            # with CERTIFICATE_VERIFY_FAILED.
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            # --- OIDC via Pocket ID -----------------------------------------
            # An ADDITIONAL login path, not the only one.
            # PAPERLESS_DISABLE_REGULAR_LOGIN is deliberately left unset (it
            # defaults to False), so the local admin account keeps working if
            # Pocket ID is unreachable or this client is misconfigured. Do not
            # set it to true without another way in.
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            # Credentials arrive by reference and are interpolated into the JSON
            # below via $(VAR). Kubernetes expands $(VAR) only against env vars
            # declared EARLIER in this list, so these two must stay above
            # PAPERLESS_SOCIALACCOUNT_PROVIDERS. Same idiom as DATABASE_URL in
            # appflowy/gotrue.yaml; it keeps the client secret out of this file.
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperless-ngx
                  key: oidc-client-secret
            # provider_id "pocketid" determines the callback path allauth
            # serves: /accounts/oidc/pocketid/login/callback/ - it must match
            # the callback URL registered on the Pocket ID client.
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: '{"openid_connect":{"APPS":[{"provider_id":"pocketid","name":"Pocket ID","client_id":"$(OIDC_CLIENT_ID)","secret":"$(OIDC_CLIENT_SECRET)","settings":{"server_url":"https://id.watchtower.local/.well-known/openid-configuration"}}]}}'
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /media
              subPath: media
            - name: data
              mountPath: /consume
              subPath: consume
            - name: data
              mountPath: /export
              subPath: export
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            # OCR model warm-up on a cold start is slow; allow up to 5 minutes.
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              # One worker, one thread — a single core is the ceiling by design.
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: homelab-ca
          configMap:
            name: homelab-ca
        - name: ca-bundle
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: tmp
          emptyDir: {}
