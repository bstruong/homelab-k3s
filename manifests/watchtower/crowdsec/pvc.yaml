---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-data
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: appdata
  hostPath:
    path: /mnt/appdata/crowdsec
    type: DirectoryOrCreate
  claimRef:
    namespace: monitoring
    name: crowdsec-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["watchtower"]
---
# Holds the decision database and the downloaded hub collections, plus the
# local API credentials generated on first start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: appdata
  volumeName: crowdsec-data
  resources:
    requests:
      storage: 5Gi
