---
# No ingress: CrowdSec has no web UI. The LAPI is reachable in-cluster so that
# bouncers (the Traefik plugin) can query decisions.
apiVersion: v1
kind: Service
metadata:
  name: crowdsec
  namespace: monitoring
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crowdsec
  ports:
    - name: lapi
      port: 8080
      targetPort: lapi
    - name: metrics
      port: 6060
      targetPort: metrics
