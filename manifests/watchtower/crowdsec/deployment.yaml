---
# CrowdSec runs the local API and the log-parsing agent in one pod. On a
# single-node cluster that is the whole deployment; adding nodes would mean
# splitting the agent out into a DaemonSet pointed at this LAPI.
#
# ROOT IS REQUIRED HERE. Container logs under /var/log/pods are owned by root
# and mode 0640 — an unprivileged uid simply cannot read them, and reading them
# is the entire job. Every capability is dropped and both host mounts are
# read-only, so this reads logs and nothing else.
#
# Detection alone does not block anything. To actually drop traffic, register
# the Traefik bouncer plugin with the bouncer-key from the Secret; see
# docs/SECRETS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec
  namespace: monitoring
  labels:
    app.kubernetes.io/name: crowdsec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:v1.6.4
          env:
            - name: COLLECTIONS
              value: crowdsecurity/traefik crowdsecurity/base-http-scenarios crowdsecurity/http-cve
            - name: DISABLE_ONLINE_API
              value: "false"
            - name: USE_WAL
              value: "true"
            # Registers a bouncer under this key at startup, so the Traefik
            # plugin can authenticate without a manual `cscli bouncers add`.
            - name: BOUNCER_KEY_traefik
              valueFrom:
                secretKeyRef:
                  name: crowdsec
                  key: bouncer-key
            # Optional: links this instance to app.crowdsec.net. Empty is fine.
            - name: ENROLL_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec
                  key: enroll-key
            - name: ENROLL_INSTANCE_NAME
              value: watchtower
          ports:
            - name: lapi
              containerPort: 8080
            - name: metrics
              containerPort: 6060
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/crowdsec/data
              subPath: data
            - name: data
              mountPath: /etc/crowdsec
              subPath: config
            - name: acquis
              mountPath: /etc/crowdsec/acquis.d
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            # /var/log/pods entries are symlinks into containerd's state
            # directory, so that has to be visible too or the reads dangle.
            - name: containerd-logs
              mountPath: /var/lib/rancher/k3s/agent/containerd
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-data
        - name: acquis
          configMap:
            name: crowdsec-acquis
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: containerd-logs
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd
            type: Directory
