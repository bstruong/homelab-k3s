---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adguard-home
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# DNS has to be reachable from the LAN, not just from inside the cluster.
# On k3s this is served by the built-in klipper load-balancer, which publishes
# :53 on the node itself.
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: adguard-home
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
