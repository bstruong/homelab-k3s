---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: adguard
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  replicas: 1
  strategy:
    # Single RWO host-path volume: the old pod must release it before the new
    # one starts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-home
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      automountServiceAccountToken: false
      # ROOT IS REQUIRED HERE, and capabilities cannot substitute for it.
      #
      # On a first launch (no AdGuardHome.yaml yet) AdGuard calls its
      # admin-rights check, which on Linux is a plain `os.Getuid() == 0` test.
      # It does not probe for CAP_NET_BIND_SERVICE or try the bind and fall
      # back — so granting capabilities has no effect on it, and running as
      # uid 1000 exits with "You must run it as Administrator."
      #
      # NET_BIND_SERVICE is kept because it is still what allows :53 once the
      # process drops nothing; every other capability stays dropped.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.52
          args:
            # AdGuard Home parses its own command line rather than using a
            # flag library, and this build matches option names by exact
            # string — so `--work-dir=<path>` is read as an unknown option.
            # Flag and value must be separate argv entries.
            - --no-check-update
            - --work-dir
            - /opt/adguardhome/work
            - --config
            - /opt/adguardhome/conf/AdGuardHome.yaml
          ports:
            - name: http
              containerPort: 80
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # Required to bind :53. Everything else is dropped.
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-home-data
