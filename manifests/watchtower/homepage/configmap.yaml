---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: home
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Watchtower
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Infrastructure:
        style: row
        columns: 3
      Identity:
        style: row
        columns: 3
      Media & Documents:
        style: row
        columns: 3
      Sync & Home:
        style: row
        columns: 4

  # Widget API keys belong in the Secret, referenced as {{HOMEPAGE_VAR_*}}.
  # Never inline a key here — this file is committed to a public repository.
  services.yaml: |
    - Infrastructure:
        - Traefik:
            href: https://traefik.watchtower.local/dashboard/
            description: Ingress controller
            namespace: kube-system
            app: traefik
        - AdGuard Home:
            href: https://dns.watchtower.local
            description: DNS and ad blocking
            namespace: adguard
            app: adguard-home
            # Live query/blocked counts. Credentials come from the
            # homepage-widgets SealedSecret via envFrom — never literal here,
            # this ConfigMap is committed to a PUBLIC repo.
            widget:
              type: adguard
              url: http://adguard-home.adguard:3000
              username: brian
              password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
        - Beszel:
            href: https://beszel.watchtower.local
            description: Host metrics
            namespace: monitoring
            app: beszel-hub
            # Live CPU/memory/disk for the paired host. Authenticates as a
            # dedicated PocketBase superuser (homepage@watchtower.local), not
            # the personal admin account — the widget needs superuser rights,
            # and a scoped account can be rotated without touching that login.
            # systemId accepts the system id or its name; homepage matches on
            # `item.id === systemId || item.name === systemId`.
            widget:
              type: beszel
              url: http://beszel-hub.monitoring:8090
              # version 2 is REQUIRED here and is not the default. Homepage
              # defaults to version 1, which authenticates against PocketBase
              # /api/admins/ — an endpoint that no longer exists in the
              # PocketBase 0.23+ that Beszel 0.9.1 embeds. The request then hits
              # the SPA fallback and returns the Beszel index.html with HTTP
              # 200, the widget parses no token out of it, and the resulting
              # Authorization header fails with ERR_INVALID_CHAR on the
              # newlines in that HTML. version 2 uses _superusers instead.
              version: 2
              username: {{HOMEPAGE_VAR_BESZEL_USERNAME}}
              password: {{HOMEPAGE_VAR_BESZEL_PASSWORD}}
              systemId: watchtower
        - Uptime Kuma:
            href: https://status.watchtower.local
            description: Uptime monitoring
            namespace: monitoring
            app: uptime-kuma
            # Live up/down/uptime counts, read from the published `watchtower`
            # status page. The in-cluster Service URL is used rather than the
            # public hostname on purpose: CoreDNS forwards external names to the
            # node stub resolver and cannot resolve *.watchtower.local reliably,
            # whereas cluster DNS always works.
            widget:
              type: uptimekuma
              url: http://uptime-kuma.monitoring:3001
              slug: watchtower
        - ntfy:
            href: https://ntfy.watchtower.local
            description: Push notifications
            namespace: monitoring
            app: ntfy
        - CASTER:
            # Headless Rails pipeline — there is no web UI. The site root
            # returns HTTP 404 by design (verified against the live ingress),
            # so href points at /up, the Rails health endpoint, which returns
            # 200 and is the only route the app serves. Known and expected
            # limitation, not a bug — do not "fix" this by pointing href at /.
            # No widget block: homepage has no widget type for a headless
            # data pipeline, so this tile is a link plus k8s pod status.
            href: https://caster.watchtower.local/up
            description: MLS market intelligence pipeline
            namespace: caster
            app: caster

    - Identity:
        - Vaultwarden:
            href: https://vault.watchtower.local
            description: Password manager
            namespace: identity
            app: vaultwarden
        - Pocket ID:
            href: https://id.watchtower.local
            description: OIDC provider
            namespace: identity
            app: pocket-id

    - Media & Documents:
        - Jellyfin:
            href: https://jellyfin.watchtower.local
            description: Media library
            namespace: media
            app: jellyfin
            # Homepage has no `jellyfin` widget type; Jellyfin is covered by the
            # emby widget, which speaks the same API.
            widget:
              type: emby
              url: http://jellyfin.media:8096
              key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
        - Paperless-ngx:
            href: https://paperless.watchtower.local
            description: Document archive
            namespace: docs
            app: paperless-ngx
            # Live inbox/total document counts. The API token is injected from
            # the homepage-widgets SealedSecret via envFrom and substituted
            # here at config-load time — this ConfigMap is committed to a
            # PUBLIC repo, so no credential may appear in it literally.
            widget:
              type: paperlessngx
              url: http://paperless-ngx.docs:8000
              key: {{HOMEPAGE_VAR_PAPERLESS_TOKEN}}
        - AppFlowy:
            href: https://appflowy.watchtower.local
            description: Notes and docs
            namespace: docs
            app: appflowy-cloud

    - Sync & Home:
        - Syncthing:
            href: https://syncthing.watchtower.local
            description: File sync
            namespace: sync
            app: syncthing
        - PairDrop:
            href: https://drop.watchtower.local
            description: Local file transfer
            namespace: sync
            app: pairdrop
        - Home Assistant:
            href: https://home.watchtower.local
            description: Home automation
            namespace: home
            app: home-assistant

  widgets.yaml: |
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: watchtower
        nodes:
          show: false
    - search:
        provider: duckduckgo
        target: _blank

  # The Headscale bookmark is NOT equivalent to the Tailscale one it replaced.
  # That one pointed at login.tailscale.com/admin/machines — the device manager.
  # Headscale ships no such web UI. The URL below is the coordination server;
  # `/` returns 200 with a literally empty document — `<body></body>`, verified
  # against headscale 0.29.2 — so the bookmark is a jumping-off point, not a
  # device list.
  #
  # To actually see or manage connected devices, run on Watchtower:
  #
  #   sudo headscale nodes list
  #   sudo headscale nodes delete --identifier <id>
  #
  # A web device manager means deploying a community project — headscale-ui or
  # headscale-admin — neither of which is in this repo. If you add one, give it
  # its own manifest directory and point this bookmark at its IngressRoute
  # instead.
  #
  # Headscale runs as a host service on Watchtower, not in k3s, so this is a
  # direct host:port URL that bypasses Traefik. 192.168.1.92:8080 works too, if
  # mDNS resolution is unreliable from a given client.
  bookmarks.yaml: |
    - Homelab:
        - Repository:
            - abbr: GH
              href: https://github.com/bstruong/homelab-k3s
        - Headscale:
            - abbr: HS
              href: http://watchtower.local:8080

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    # Intentionally empty — everything runs in k3s, not Docker.
