---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: home
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
      # NO checksum/config annotation, deliberately.
      #
      # There used to be one here, permanently set to the literal string
      # "replace-me-on-config-change". An annotation only rolls the pod when
      # its VALUE changes, so a constant placeholder rolls nothing — it read
      # as a working safeguard while doing nothing at all. Commit a6ffc5c
      # proved it: it added the live Paperless-ngx widget to configmap.yaml
      # and left the placeholder untouched, so the running pod kept serving
      # the old config until someone restarted it by hand.
      #
      # These manifests are raw YAML applied with `kubectl apply -f` — there
      # is no Helm, no kustomize and no envsubst in this repo, so a manifest
      # cannot compute a hash of its own ConfigMap. The honest options were a
      # value bumped by hand on every config edit (the same discipline that
      # already failed once) or a checksum injected by deploy.sh at apply
      # time, which would make the live annotation permanently differ from
      # the committed file. Neither is worth it for one restart command.
      #
      # So: CHANGING configmap.yaml REQUIRES A MANUAL RESTART.
      #
      #     kubectl rollout restart deployment/homepage -n home
      #
      # This is not a workaround, it is the actual procedure — and it is what
      # has always happened in practice. It matters because seed-config below
      # COPIES the ConfigMap into an emptyDir at boot rather than mounting it;
      # a ConfigMap edit therefore never reaches a running pod, with or
      # without an annotation.
    spec:
      nodeSelector:
        kubernetes.io/hostname: watchtower
      # The one workload that legitimately needs API access — its widgets read
      # workload status. The ClusterRole is read-only, in rbac.yaml.
      serviceAccountName: homepage
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Homepage writes logs into /app/config, so the ConfigMap cannot be
        # mounted there directly (it is read-only). Copy the files into a
        # writable emptyDir instead.
        - name: seed-config
          image: busybox:1.37
          command: ["sh", "-c", "cp /seed/*.yaml /app/config/ && echo seeded config"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-seed
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v0.10.9
          env:
            # Required since v0.9: homepage refuses requests whose Host header
            # is not listed here.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.watchtower.local,watchtower.local
            - name: PORT
              value: "3000"
          # Widget credentials. services.yaml refers to these as
          # {{HOMEPAGE_VAR_*}} and homepage substitutes them at config-load
          # time, so the ConfigMap — which is committed to this PUBLIC repo —
          # never contains an API key or password. The values come from the
          # SealedSecret alongside it. optional: true so the deployment still
          # starts before the secret is unsealed, with the affected widgets
          # simply erroring rather than the whole pod failing to schedule.
          envFrom:
            - secretRef:
                name: homepage-widgets
                optional: true
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          emptyDir: {}
        - name: config-seed
          configMap:
            name: homepage-config
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
