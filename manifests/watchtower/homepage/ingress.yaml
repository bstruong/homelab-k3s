---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-http
  namespace: home
spec:
  entryPoints: ["web"]
  routes:
    # Both the bare domain and homepage.* land here, so watchtower.local is the
    # front door for the whole stack.
    - kind: Rule
      match: Host(`homepage.watchtower.local`) || Host(`watchtower.local`)
      services:
        - name: homepage
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-https
  namespace: home
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`homepage.watchtower.local`) || Host(`watchtower.local`)
      services:
        - name: homepage
          port: 3000
  tls:
    secretName: homepage-tls