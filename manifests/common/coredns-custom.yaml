---
# Forward *.watchtower.local to AdGuard only.
#
# The managed Corefile ends with `forward . /etc/resolv.conf`, and the
# resolv.conf CoreDNS is handed lists TWO upstreams: AdGuard (192.168.1.92,
# which holds the *.watchtower.local rewrites) and the router (192.168.1.1,
# which knows nothing about them and answers NXDOMAIN). CoreDNS spreads queries
# across both, so roughly half of all *.watchtower.local lookups got NXDOMAIN —
# and `cache 30` then pinned that negative answer for 30 seconds.
#
# That is what made in-cluster resolution of these names flap: Uptime Kuma
# monitors intermittently ENOTFOUND, and Vaultwarden's OIDC discovery failing
# with "Failed to discover OpenID provider" whenever it landed in a bad window.
#
# This server block takes watchtower.local out of the round-robin entirely and
# sends it only to the host that can answer it. The managed Corefile already
# ends with `import /etc/coredns/custom/*.server`, and the CoreDNS deployment
# mounts this ConfigMap at /etc/coredns/custom (optional: true), so nothing
# k3s-managed needs editing — which also means a k3s upgrade will not revert it.
#
# The `template` stanza closes a search-domain leak. Pods get `ndots:5` and a
# search list ending in `watchtower.local`, so ANY external hostname with fewer
# than 5 dots is tried as `<name>.watchtower.local` FIRST. AdGuard's
# `*.watchtower.local` wildcard answered every one of those with 192.168.1.92,
# so `github.com`, `api.github.com`, `cdn-hub.crowdsec.net` and effectively the
# whole internet resolved to Traefik from inside every pod — which then served
# its self-signed `CN=TRAEFIK DEFAULT CERT`, breaking TLS cluster-wide.
#
# Every real service name under this zone is single-label (jellyfin, vault,
# registry, ...); every leaked name is multi-label by construction, because it
# is an external FQDN with the search domain appended. So NXDOMAIN on 2+ labels
# closes the leak exactly, and the resolver then continues down the search list
# to the bare external FQDN and resolves it correctly. `fallthrough` keeps
# single-label names going to `forward`, preserving the fix described above.
#
# This is ordinary split-horizon hygiene: an internal zone should answer only
# for names it actually owns and NXDOMAIN otherwise.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  watchtower.server: |
    watchtower.local:53 {
        errors
        cache 30
        template ANY ANY watchtower.local {
            match "^([^.]+\.){2,}watchtower\.local\.$"
            rcode NXDOMAIN
            fallthrough
        }
        forward . 192.168.1.92
    }

  # Return NODATA for every AAAA query.
  #
  # Pods on this cluster have no IPv6 egress: eth0 carries only a link-local
  # fe80::/64 address and there is no IPv6 default route. Plenty of external
  # names do have AAAA records, though — oauth2.googleapis.com among them.
  # Go's resolver sorts the AAAA answer first (RFC 6724), and when a degraded
  # upstream hands back the AAAA without the A there is nothing reachable left
  # to dial:
  #
  #     Post "https://oauth2.googleapis.com/token":
  #     dial tcp [2607:f8b0:4023:c03::5f]:443: connect: network is unreachable
  #
  # That killed an Antigravity OAuth token exchange outright and burned the
  # single-use authorization code with it. The same upstream flap that produces
  # "server misbehaving" also broke a playwright driver download and repeated
  # profile-picture fetches, so this is intermittent rather than rare.
  #
  # Answering NODATA — "the name exists, it simply has no AAAA" — makes the
  # resolver fall straight through to the A record, which works. That is also
  # the honest answer here: these names have no address this cluster can reach
  # over IPv6.
  #
  # NODATA is not a DNS rcode and CoreDNS rejects `rcode NODATA` outright
  # ("unknown rcode NODATA"), which crashloops the pod and takes cluster DNS
  # down with it. NODATA is a *condition*: NOERROR with an empty answer
  # section. So the rule sets `rcode NOERROR` and generates no records, which
  # is exactly that.
  #
  # This is a *.override, not a *.server. The managed Corefile expands
  # `import /etc/coredns/custom/*.override` INSIDE the main `.:53` block,
  # immediately before `forward . /etc/resolv.conf`, so the rule covers general
  # external forwarding. (CoreDNS orders plugins by its compiled-in plugin.cfg
  # rather than by position in the Corefile, and `template` sorts ahead of
  # `forward` either way — but the block it lands in is what scopes it.)
  #
  # With no `match` regex the template matches every name, so `fallthrough` is
  # never reached; it is kept as a safety net, because a future `match` that
  # failed would otherwise return NXDOMAIN for AAAA, which is worse than NODATA.
  #
  # A records, PTR lookups, and the watchtower.local block above are untouched.
  aaaa.override: |
    template ANY AAAA . {
        rcode NOERROR
        fallthrough
    }
