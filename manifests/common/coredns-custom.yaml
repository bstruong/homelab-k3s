---
# Forward *.watchtower.local to AdGuard only.
#
# The managed Corefile ends with `forward . /etc/resolv.conf`, and the
# resolv.conf CoreDNS is handed lists TWO upstreams: AdGuard (192.168.1.92,
# which holds the *.watchtower.local rewrites) and the router (192.168.1.1,
# which knows nothing about them and answers NXDOMAIN). CoreDNS spreads queries
# across both, so roughly half of all *.watchtower.local lookups got NXDOMAIN —
# and `cache 30` then pinned that negative answer for 30 seconds.
#
# That is what made in-cluster resolution of these names flap: Uptime Kuma
# monitors intermittently ENOTFOUND, and Vaultwarden's OIDC discovery failing
# with "Failed to discover OpenID provider" whenever it landed in a bad window.
#
# This server block takes watchtower.local out of the round-robin entirely and
# sends it only to the host that can answer it. The managed Corefile already
# ends with `import /etc/coredns/custom/*.server`, and the CoreDNS deployment
# mounts this ConfigMap at /etc/coredns/custom (optional: true), so nothing
# k3s-managed needs editing — which also means a k3s upgrade will not revert it.
#
# The `template` stanza closes a search-domain leak. Pods get `ndots:5` and a
# search list ending in `watchtower.local`, so ANY external hostname with fewer
# than 5 dots is tried as `<name>.watchtower.local` FIRST. AdGuard's
# `*.watchtower.local` wildcard answered every one of those with 192.168.1.92,
# so `github.com`, `api.github.com`, `cdn-hub.crowdsec.net` and effectively the
# whole internet resolved to Traefik from inside every pod — which then served
# its self-signed `CN=TRAEFIK DEFAULT CERT`, breaking TLS cluster-wide.
#
# Every real service name under this zone is single-label (jellyfin, vault,
# registry, ...); every leaked name is multi-label by construction, because it
# is an external FQDN with the search domain appended. So NXDOMAIN on 2+ labels
# closes the leak exactly, and the resolver then continues down the search list
# to the bare external FQDN and resolves it correctly. `fallthrough` keeps
# single-label names going to `forward`, preserving the fix described above.
#
# This is ordinary split-horizon hygiene: an internal zone should answer only
# for names it actually owns and NXDOMAIN otherwise.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  watchtower.server: |
    watchtower.local:53 {
        errors
        cache 30
        template ANY ANY watchtower.local {
            match "^([^.]+\.){2,}watchtower\.local\.$"
            rcode NXDOMAIN
            fallthrough
        }
        forward . 192.168.1.92
    }
