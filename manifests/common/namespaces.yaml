---
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    homelab.watchtower/stack: watchtower
    # baseline allows pod-level self-healing volume permission initContainers
    # (chown 1000:1000) for hostPath volumes without manual host interventions.
    # Auditing and warnings remain pinned to restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    homelab.watchtower/stack: watchtower
    # Beszel agent needs hostPID/hostPath to read node metrics.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: docs
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    homelab.watchtower/stack: watchtower
    # privileged: github-runner needs START_DOCKER_SERVICE + privileged for
    # Actions Postgres service containers (Watchtower has no host docker.sock).
    # Registry and other infra apps remain unprivileged; PSA privileged is a
    # ceiling that allows them, not a requirement that they elevate.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: caster
  labels:
    homelab.watchtower/stack: watchtower
    # baseline allows the postgres self-healing initContainer (chown 999:999,
    # chmod 700) to ensure data directory permissions without manual host chown.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    homelab.watchtower/stack: watchtower
    # baseline, not restricted: the immich-server image declares no USER and
    # upstream runs it as root, which restricted forbids. It still drops ALL
    # capabilities and disables privilege escalation, so it is root without
    # root's powers. Its Postgres (uid 999) and Redis (uid 1000) are both
    # restricted-compliant regardless.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: dojo
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: jarvis
  labels:
    homelab.watchtower/stack: watchtower
    # Privileged is required to grant IPC_LOCK for mlock on llama-server.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: alpha
  labels:
    homelab.watchtower/stack: watchtower
    # Campaign runner Jobs (CPU client to JARVIS). GPU inference stays in jarvis.
    # privileged PSA ceiling: Phase 2 bubblewrap needs Unconfined seccomp/AppArmor
    # so evaluated agents can create unprivileged user namespaces. Pods stay
    # non-root with capabilities dropped; this is not a license to run privileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: odysseus
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline

