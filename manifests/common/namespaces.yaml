---
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    homelab.watchtower/stack: watchtower
    # Beszel agent needs hostPID/hostPath to read node metrics.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: docs
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: sync
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: odysseus
  labels:
    homelab.watchtower/stack: watchtower
    # baseline, not restricted: the Odysseus app container starts as
    # root and drops to PUID/PGID via gosu, which restricted forbids.
    # ChromaDB and SearXNG are both restricted-compliant regardless.
    pod-security.kubernetes.io/enforce: baseline
