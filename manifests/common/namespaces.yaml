---
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    homelab.watchtower/stack: watchtower
    # baseline allows pod-level self-healing volume permission initContainers
    # (chown 1000:1000) for hostPath volumes without manual host interventions.
    # Auditing and warnings remain pinned to restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    homelab.watchtower/stack: watchtower
    # Beszel agent needs hostPID/hostPath to read node metrics.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: docs
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    homelab.watchtower/stack: watchtower
    # baseline allows pod-level self-healing volume permission initContainers
    # (chown 1000:1000) for hostPath volumes without manual host interventions.
    # Auditing and warnings remain pinned to restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: caster
  labels:
    homelab.watchtower/stack: watchtower
    # baseline allows the postgres self-healing initContainer (chown 999:999,
    # chmod 700) to ensure data directory permissions without manual host chown.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    homelab.watchtower/stack: watchtower
    # baseline, not restricted: the immich-server image declares no USER and
    # upstream runs it as root, which restricted forbids. It still drops ALL
    # capabilities and disables privilege escalation, so it is root without
    # root's powers. Its Postgres (uid 999) and Redis (uid 1000) are both
    # restricted-compliant regardless.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: dojo
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
