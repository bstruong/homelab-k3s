---
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    homelab.watchtower/stack: watchtower
    # Beszel agent needs hostPID/hostPath to read node metrics.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: docs
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: sync
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    homelab.watchtower/stack: watchtower
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: odysseus
  labels:
    homelab.watchtower/stack: watchtower
    # baseline, not restricted: the Odysseus app container starts as
    # root and drops to PUID/PGID via gosu, which restricted forbids.
    # ChromaDB and SearXNG are both restricted-compliant regardless.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    homelab.watchtower/stack: watchtower
    # restricted, not baseline: the registry pod runs as uid 1000, drops ALL
    # capabilities and sets seccomp RuntimeDefault, so it already complies.
    # The hostPath-backed PV is not a problem — restricted constrains the
    # pod's volume *types* (persistentVolumeClaim is allowed), not what the
    # PV happens to be backed by. Same arrangement as vaultwarden in
    # `identity`, which is also restricted.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: caster
  labels:
    homelab.watchtower/stack: watchtower
    # restricted: Postgres runs as uid 999 and the Rails app as uid 1000, both
    # non-root, both dropping ALL capabilities with seccomp RuntimeDefault.
    # Same posture as `infra` and `identity`. Note this is CASTER's own
    # namespace rather than a shared one — its Postgres is single-tenant, not
    # the `docs` instance, which belongs to AppFlowy.
    pod-security.kubernetes.io/enforce: restricted
