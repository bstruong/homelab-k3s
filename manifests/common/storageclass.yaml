# Static host-path storage for the Watchtower node.
#
# Every app claims a PersistentVolume that is pinned to a directory under
# /mnt/appdata on the Watchtower node. Binding is one-to-one via claimRef, so a
# PVC can never grab another app's data directory.
#
# volumeBindingMode: WaitForFirstConsumer keeps scheduling and binding in sync
# on a single-node cluster; reclaimPolicy: Retain means deleting a PVC never
# deletes the data on disk.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: appdata
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
